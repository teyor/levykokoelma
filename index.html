<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Levykokoelma</title>
  <style>
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { font-family: Arial, sans-serif; margin: 0; padding: 16px; background: #111; color: #eee; }
    h1 { color: #ffcc00; font-size: 1.6rem; margin: 0 0 12px; }
    input, button, select, textarea { padding: 12px; margin: 5px 0; width: 100%; max-width: 100%; font-size: 16px; border-radius: 6px; border: 1px solid #444; background: #1a1a1a; color: #eee; }
    .field-group { margin: 8px 0; }
    .field-group > label { display: block; margin: 10px 0 2px; font-weight: bold; color: #eee; }
    .price-row { display: flex; align-items: center; gap: 8px; max-width: 400px; }
    .price-row input { flex: 1; width: auto; max-width: none; }
    .price-unit { font-weight: bold; color: #ffcc00; }
    .catalog-row { display: flex; flex-wrap: wrap; gap: 8px; max-width: 400px; }
    .catalog-row > div { flex: 1 1 140px; min-width: 0; }
    .catalog-row > div:last-child { flex: 0 1 150px; }
    .catalog-row label { display: block; margin: 10px 0 2px; font-weight: bold; color: #eee; }
    .catalog-row input { width: 100%; max-width: none; }
    button { background: #ffcc00; color: black; border: none; font-weight: bold; cursor: pointer; min-height: 44px; }
    .row-btns { display: flex; flex-wrap: wrap; gap: 8px; max-width: 100%; }
    .row-btns button { width: auto; flex: 1 1 140px; }
    .delete-btn { background: #ff4444; color: white; padding: 10px 12px; font-size: 15px; width: 100%; margin-top: 8px; }
    #preview { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; }
    .preview-item { position: relative; width: 110px; height: 110px; border: 2px solid #ffcc00; border-radius: 6px; overflow: hidden; background: #222; }
    .preview-item img { width: 100%; height: 100%; object-fit: cover; }
    .remove-image { position: absolute; top: 4px; right: 4px; background: #ff4444; color: white; border: none; padding: 2px 7px; font-size: 14px; cursor: pointer; border-radius: 3px; width: auto; min-height: 28px; }
    .thumbnail { width: 100%; height: 200px; object-fit: cover; border-radius: 4px; }
    .search { padding: 12px; width: 100%; max-width: 100%; font-size: 16px; }
    .search-wrap { position: relative; width: 100%; max-width: 100%; margin: 5px 0; }
    .search-wrap .search { margin: 0; padding-right: 52px; max-width: none; }
    .search::-webkit-search-cancel-button, .search::-webkit-search-decoration { -webkit-appearance: none; appearance: none; display: none; }
    .search::-ms-clear { display: none; width: 0; height: 0; }
    .search-clear { position: absolute; top: 50%; right: 4px; transform: translateY(-50%); width: 44px; height: 44px; min-height: 44px; max-width: none; margin: 0; padding: 0; border: none; border-radius: 50%; background: transparent; color: #aaa; font-size: 26px; line-height: 44px; text-align: center; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .search-clear:hover, .search-clear:focus-visible { color: #ffcc00; background: #2a2a2a; outline: none; }
    .search-clear:active { color: #111; background: #ffcc00; }
    .search-clear[hidden] { display: none; }
    .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 16px; }
    .card { background: #1f1f1f; padding: 12px; border-radius: 8px; }
    .card img { width: 100%; border-radius: 4px; margin-bottom: 5px; }
    .note { color: #aaa; font-size: 14px; max-width: 100%; }
    /* A–Ö letter jump bar (contacts style). Shown only while the full list is in view. */
    .list { padding-right: 30px; }
    .letter-bar { position: fixed; right: 2px; top: 50%; transform: translateY(-50%); z-index: 50; display: flex; flex-direction: column; align-items: stretch; width: 28px; height: min(calc(100vh - 24px), 784px); height: min(calc(100dvh - 24px), 784px); padding: 4px 0; margin: 0; background: rgba(26, 26, 26, 0.85); border: 1px solid #333; border-radius: 14px; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    .letter-bar[hidden] { display: none; }
    .letter-bar span { flex: 1 1 0; min-height: 0; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #ffcc00; font-size: clamp(9px, calc((100vh - 40px) / 28 * 0.6), 15px); font-size: clamp(9px, calc((100dvh - 40px) / 28 * 0.6), 15px); line-height: 1; cursor: pointer; border-radius: 50%; }
    .letter-bar span.off { color: #555; cursor: default; pointer-events: none; }
    .letter-bar span.active { background: #ffcc00; color: #111; }
    .letter-bubble { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 60; width: 96px; height: 96px; border-radius: 50%; background: rgba(255, 204, 0, 0.95); color: #111; font-size: 56px; font-weight: bold; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0; transition: opacity 0.25s; box-shadow: 0 4px 18px rgba(0,0,0,0.6); }
    .letter-bubble.show { opacity: 1; transition: none; }
    @media (min-width: 640px) {
      body { padding: 20px; }
      input, button { max-width: 400px; }
      .search, .search-wrap { max-width: 500px; }
      .search-wrap .search { max-width: none; }
      .list { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
      .preview-item { width: 130px; height: 130px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Levykokoelma</h1>
    <p class="note">Muutokset tallentuvat tämän selaimen muistiin. Ota välillä varmuuskopio napilla "Vie tiedot (JSON)".</p>

    <div class="search-wrap">
      <input type="search" id="search" class="search" placeholder="Hae artistia tai albumia..." autocomplete="off" enterkeyhint="search" oninput="filterRecords()" onkeydown="searchKeydown(event)">
      <button type="button" id="searchClear" class="search-clear" aria-label="Tyhjennä haku" title="Tyhjennä haku" hidden onpointerdown="event.preventDefault()" onmousedown="event.preventDefault()" onclick="clearSearch()">&times;</button>
    </div>

    <h2 id="formHeading">Lisää uusi levy</h2>
    <label for="imageInput">Kansikuvat</label>
    <input type="file" id="imageInput" accept="image/*" multiple><br>
    <div id="preview"></div>

    <div class="field-group">
      <label for="artist">Artisti / Esittäjä</label>
      <input type="text" id="artist" placeholder="Pakollinen">
    </div>
    <div class="field-group">
      <label for="album">Albumin nimi</label>
      <input type="text" id="album" placeholder="Pakollinen">
    </div>
    <div class="field-group">
      <label for="purchaseDate">Hankintapäivä</label>
      <input type="date" id="purchaseDate">
    </div>
    <div class="field-group">
      <label for="price">Ostohinta</label>
      <div class="price-row">
        <input type="number" id="price" placeholder="0,00" step="0.01">
        <span class="price-unit">€</span>
      </div>
    </div>
    <div class="field-group">
      <div class="catalog-row">
        <div>
          <label for="catalogNumber">Kataloginumero</label>
          <input type="text" id="catalogNumber" placeholder="">
        </div>
        <div>
          <label for="country">Maa</label>
          <input type="text" id="country" placeholder="esim. Suomi">
        </div>
      </div>
    </div>
    <div class="field-group">
      <label for="condition">Kuntoluokitus</label>
      <select id="condition">
        <option value="">Valitse kunto</option>
        <option value="M">M — Mint</option>
        <option value="NM">NM — Near Mint</option>
        <option value="EX">EX — Excellent</option>
        <option value="VG+">VG+ — Very Good Plus</option>
        <option value="VG">VG — Very Good</option>
        <option value="G+">G+ — Good Plus</option>
        <option value="G">G — Good</option>
        <option value="F">F — Fair</option>
        <option value="P">P — Poor</option>
      </select>
    </div>
    <div class="field-group">
      <label for="marketPrice">Markkinahinta / arvio</label>
      <div class="price-row">
        <input type="text" id="marketPrice" placeholder="esim. 25–45">
        <span class="price-unit">€</span>
      </div>
    </div>
    <div class="field-group">
      <label for="notes">Lisätiedot</label>
      <textarea id="notes" rows="4" placeholder="Lisätiedot"></textarea>
    </div>

    <button type="button" id="deleteBtn" class="delete-btn" style="display:none; max-width:400px;" onclick="deleteCurrentRecord()">Poista</button>

    <div class="row-btns">
      <button onclick="addRecord()">Lisää / Tallenna muokkaus</button>
      <button onclick="exportData()">Vie tiedot (JSON)</button>
      <button onclick="document.getElementById('importInput').click()">Lataa tiedot</button>
    </div>
    <input type="file" id="importInput" accept=".json" style="display:none" onchange="importData(event)">

    <h2>Kokoelma (<span id="count">0</span> levyä)</h2>
    <div id="collection" class="list"></div>
  </div>
  <nav id="letterBar" class="letter-bar" aria-label="Hyppää kirjaimeen" hidden></nav>
  <div id="letterBubble" class="letter-bubble" aria-hidden="true"></div>

        Object.keys(u.set).forEach(field => {
          const [value, replaceable] = u.set[field];
          const cur = rec[field] === undefined || rec[field] === null ? "" : String(rec[field]).trim();
          if (replaceable.indexOf(cur) >= 0) rec[field] = value;
        });
        if (u.replaceImages && Array.isArray(rec.images)) {
          rec.images = rec.images.map(img => u.replaceImages[img] || img)
            .filter((img, i, arr) => arr.indexOf(img) === i);
        }
        if (u.addImagesFromSeed) {
          const s = seed.find(r => normalizeKey(r) === key);
          if (s && Array.isArray(s.images)) {
            if (!Array.isArray(rec.images)) rec.images = [];
            s.images.forEach(img => { if (rec.images.indexOf(img) < 0) rec.images.push(img); });
          }
        }
      });
    }

    let records;
    if (savedVersion < DATA_VERSION) {
      const stored = loadStored();
      records = mergeStoredWithSeed(stored, seed);
      applyTargetedUpdates(records, savedVersion);
      persist(records, true);
    } else {
      const stored = loadStored();
      records = dedupeKeepFirst(stored.length ? stored : seed).map(withDefaults);
      persist(records, false);
    }

    let editingIndex = -1;
    let currentImages = [];

    function readImage() {
      const files = document.getElementById("imageInput").files;
      Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = async e => {
          const src = await compressDataUrl(e.target.result, 1000, 0.75);
          currentImages.push(src);
          addPreviewImage(src);
        };
        reader.readAsDataURL(file);
      });
    }

    function addPreviewImage(src) {
      const previewDiv = document.getElementById("preview");
      const container = document.createElement("div");
      container.className = "preview-item";
      const img = document.createElement("img");
      img.src = src;
      const btn = document.createElement("button");
      btn.className = "remove-image";
      btn.type = "button";
      btn.textContent = "×";
      btn.onclick = function () {
        container.remove();
        currentImages = currentImages.filter(i => i !== src);
      };
      container.appendChild(img);
      container.appendChild(btn);
      previewDiv.appendChild(container);
    }

    document.getElementById("imageInput").onchange = readImage;

    function save() {
      records = dedupeKeepFirst(records);
      persist(records, true);
    }

    function addRecord() {
      const artist = document.getElementById("artist").value.trim();
      const album = document.getElementById("album").value.trim();
      const purchaseDate = document.getElementById("purchaseDate").value;
      const price = document.getElementById("price").value;
      const catalogNumber = document.getElementById("catalogNumber").value.trim();
      const country = document.getElementById("country").value.trim();
      const condition = document.getElementById("condition").value.trim();
      const marketPrice = document.getElementById("marketPrice").value;
      const notes = document.getElementById("notes").value;
      if (!artist || !album) {
        alert("Artisti ja albumin nimi ovat pakollisia!");
        return;
      }
      const newRecord = {
        artist,
        album,
        purchaseDate,
        price,
        catalogNumber,
        country,
        condition,
        marketPrice,
        notes,
        images: currentImages.length > 0 ? currentImages.slice() : [],
        dateAdded: new Date().toLocaleDateString("fi-FI")
      };
      const prev = editingIndex >= 0 ? records[editingIndex] : null;
      if (prev && prev.copy) newRecord.copy = prev.copy;
      const clash = records.some((r, i) => i !== editingIndex && normalizeKey(r) === normalizeKey(newRecord));
      if (clash) {
        const baseKey = normalizeKey({ artist, album });
        const copies = records.filter((r, i) => i !== editingIndex && normalizeKey(Object.assign({}, r, { copy: 1 })) === baseKey)
          .map(r => Number(r.copy) || 1);
        newRecord.copy = Math.max.apply(null, copies) + 1;
      }
      if (editingIndex >= 0) {
        records[editingIndex] = newRecord;
        editingIndex = -1;
      } else {
        records.push(newRecord);
      }
      save();
      renderCollection();
      filterRecords();
      resetForm();
    }

    function resetForm() {
      document.getElementById("artist").value = "";
      document.getElementById("album").value = "";
      document.getElementById("purchaseDate").value = "";
      document.getElementById("price").value = "";
      document.getElementById("catalogNumber").value = "";
      document.getElementById("country").value = "";
      document.getElementById("condition").value = "";
      document.getElementById("marketPrice").value = "";
      document.getElementById("notes").value = "";
      document.getElementById("preview").innerHTML = "";
      currentImages = [];
      document.getElementById("imageInput").value = "";
      editingIndex = -1;
      document.getElementById("deleteBtn").style.display = "none";
      document.getElementById("formHeading").textContent = "Lisää uusi levy";
    }

    function editRecord(index) {
      const r = records[index];
      editingIndex = index;
      document.getElementById("artist").value = r.artist;
      document.getElementById("album").value = r.album;
      document.getElementById("purchaseDate").value = r.purchaseDate || "";
      document.getElementById("price").value = r.price || "";
      document.getElementById("catalogNumber").value = r.catalogNumber || "";
      document.getElementById("country").value = r.country || "";
      document.getElementById("condition").value = r.condition || "";
      document.getElementById("marketPrice").value = r.marketPrice || "";
      document.getElementById("notes").value = r.notes || "";
      const previewDiv = document.getElementById("preview");
      previewDiv.innerHTML = "";
      currentImages = r.images ? r.images.slice() : [];
      currentImages.forEach(src => addPreviewImage(src));
      document.getElementById("deleteBtn").style.display = "block";
      document.getElementById("formHeading").textContent = "Muokkaa levyn";
      window.scrollTo(0, 0);
    }

    function deleteRecord(index) {
      if (confirm("Haluatko varmasti poistaa tämän levyn?")) {
        records.splice(index, 1);
        save();
        renderCollection();
        filterRecords();
        resetForm();
      }
    }

    function deleteCurrentRecord() {
      if (editingIndex < 0) return;
      deleteRecord(editingIndex);
    }

    // Default display order: alphabetical by artist (leading "The " ignored),
    // then by album. Finnish collation puts Å, Ä, Ö at the end. Sorting is
    // display-only: the records array (and its indices) are left untouched.
    const fiCollator = new Intl.Collator("fi", { sensitivity: "base", numeric: true });
    function sortName(s) {
      return String(s || "").trim().replace(/^the\s+/i, "");
    }
    function compareRecords(a, b) {
      return fiCollator.compare(sortName(a.artist), sortName(b.artist)) ||
        fiCollator.compare(String(a.artist || ""), String(b.artist || "")) ||
        fiCollator.compare(String(a.album || ""), String(b.album || ""));
    }

    function renderCollection(filteredRecords) {
      if (!filteredRecords) filteredRecords = records;
      filteredRecords = filteredRecords.slice().sort(compareRecords);
      const div = document.getElementById("collection");
      let prevLetter = null;
      div.innerHTML = filteredRecords.map(r => {
        const letter = letterOf(r);
        const letterAttr = letter !== prevLetter ? ' data-letter="' + letter + '"' : "";
        prevLetter = letter;
        const index = records.indexOf(r);
        const mainImage = r.images && r.images.length > 0 ? r.images[0] : null;
        const img = mainImage
          ? '<img src="' + mainImage + '" class="thumbnail" alt="">'
          : '<p style="color:#666; text-align:center; padding:40px 0;">Ei kuvaa</p>';
        return (
          '<div class="card"' + letterAttr + ' onclick="editRecord(' + index + ')">' +
            img +
            "<strong>" + r.artist + "</strong><br>" +
            r.album +
          "</div>"
        );
      }).join("");
      document.getElementById("count").textContent = filteredRecords.length;
      updateLetterBar();
    }

    // ---- A–Ö letter jump bar ----
    const LETTERS = ["#"].concat("ABCDEFGHIJKLMNOPQRSTUVWXYZÅÄÖ".split(""));
    function letterOf(r) {
      const ch = sortName(r.artist).charAt(0).toLocaleUpperCase("fi");
      if (!ch || /[0-9]/.test(ch)) return "#";
      if (LETTERS.indexOf(ch) > 0) return ch;
      const base = ch.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      if (base === "Ü") return "Y";
      return LETTERS.indexOf(base) > 0 ? base : "#";
    }

    let letterBarBuilt = false;
    let lastTouchTime = 0;
    let bubbleTimer = null;
    let currentDragLetter = null;

    function buildLetterBar() {
      const bar = document.getElementById("letterBar");
      bar.innerHTML = LETTERS.map(l => '<span data-l="' + l + '">' + l + "</span>").join("");
      bar.addEventListener("click", e => {
        if (Date.now() - lastTouchTime < 800) return; // already handled by touch
        const s = e.target.closest("span[data-l]");
        if (s && !s.classList.contains("off")) jumpToLetter(s.dataset.l, true, true);
      });
      const handleTouch = e => {
        e.preventDefault();
        lastTouchTime = Date.now();
        const t = e.touches[0];
        if (!t) return;
        const el = document.elementFromPoint(bar.getBoundingClientRect().left + bar.offsetWidth / 2, t.clientY);
        const s = el && el.closest ? el.closest("#letterBar span[data-l]") : null;
        if (s && !s.classList.contains("off") && s.dataset.l !== currentDragLetter) {
          currentDragLetter = s.dataset.l;
          jumpToLetter(currentDragLetter, false, true);
        }
      };
      bar.addEventListener("touchstart", e => { currentDragLetter = null; handleTouch(e); }, { passive: false });
      bar.addEventListener("touchmove", handleTouch, { passive: false });
      bar.addEventListener("touchend", () => { lastTouchTime = Date.now(); currentDragLetter = null; hideBubbleSoon(); });
      bar.addEventListener("touchcancel", () => { currentDragLetter = null; hideBubbleSoon(); });
      window.addEventListener("scroll", updateLetterBarVisibility, { passive: true });
      window.addEventListener("resize", updateLetterBarVisibility);
      letterBarBuilt = true;
    }

    function updateLetterBar() {
      if (!letterBarBuilt) buildLetterBar();
      const present = new Set(Array.from(document.querySelectorAll("#collection .card[data-letter]")).map(c => c.dataset.letter));
      document.querySelectorAll("#letterBar span[data-l]").forEach(s => {
        const off = !present.has(s.dataset.l);
        s.classList.toggle("off", off);
        if (off) s.setAttribute("aria-disabled", "true"); else s.removeAttribute("aria-disabled");
      });
      updateLetterBarVisibility();
    }

    // Visible only when the search is empty (whole collection listed) and the
    // list - not the add/edit form at the top - fills the screen.
    function updateLetterBarVisibility() {
      const bar = document.getElementById("letterBar");
      if (!bar) return;
      const searching = !!document.getElementById("search").value;
      const list = document.getElementById("collection");
      const rect = list.getBoundingClientRect();
      const inView = rect.top < window.innerHeight * 0.5 && rect.bottom > window.innerHeight * 0.3;
      const show = !searching && list.children.length > 0 && inView;
      if (bar.hidden === show) bar.hidden = !show;
    }

    function showBubble(letter) {
      const b = document.getElementById("letterBubble");
      b.textContent = letter;
      b.classList.add("show");
      clearTimeout(bubbleTimer);
    }
    function hideBubbleSoon() {
      clearTimeout(bubbleTimer);
      bubbleTimer = setTimeout(() => document.getElementById("letterBubble").classList.remove("show"), 500);
    }

    function jumpToLetter(letter, smooth, bubble) {
      const card = document.querySelector('#collection .card[data-letter="' + CSS.escape(letter) + '"]');
      if (!card) return false;
      const top = card.getBoundingClientRect().top + window.pageYOffset - 8;
      window.scrollTo({ top: Math.max(0, top), behavior: smooth ? "smooth" : "auto" });
      document.querySelectorAll("#letterBar span.active").forEach(s => s.classList.remove("active"));
      const s = document.querySelector('#letterBar span[data-l="' + CSS.escape(letter) + '"]');
      if (s) s.classList.add("active");
      if (bubble) { showBubble(letter); if (smooth) hideBubbleSoon(); }
      setTimeout(() => { if (s) s.classList.remove("active"); }, 700);
      return true;
    }

    function updateSearchClear() {
      const btn = document.getElementById("searchClear");
      if (btn) btn.hidden = !document.getElementById("search").value;
    }

    // Clear the search box, show the whole collection and keep focus in the
    // field so the on-screen keyboard stays open on mobile.
    function clearSearch() {
      const input = document.getElementById("search");
      input.value = "";
      filterRecords();
      input.focus();
    }

    function searchKeydown(e) {
      if (e.key === "Escape" || e.key === "Esc") {
        e.preventDefault();
        clearSearch();
      }
    }

    function filterRecords() {
      updateSearchClear();
      const term = document.getElementById("search").value.toLowerCase();
      const filtered = records.filter(r =>
        (r.artist || "").toLowerCase().includes(term) ||
        (r.album || "").toLowerCase().includes(term) ||
        (r.catalogNumber || "").toLowerCase().includes(term) ||
        (r.country || "").toLowerCase().includes(term) ||
        (r.condition || "").toLowerCase().includes(term) ||
        (r.notes || "").toLowerCase().includes(term)
      );
      renderCollection(filtered);
    }

    function exportData() {
      const dataStr = JSON.stringify(records, null, 2);
      const dataUri = "data:application/json;charset=utf-8," + encodeURIComponent(dataStr);
      const linkElement = document.createElement("a");
      linkElement.setAttribute("href", dataUri);
      linkElement.setAttribute("download", "levykokoelma-backup.json");
      linkElement.click();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async function (e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!Array.isArray(parsed)) throw new Error("not an array");
          // Old backups contain base64 images: built-in ones map back to images/*.jpg,
          // other large photos are shrunk so they fit in localStorage.
          const list = dedupeKeepFirst(parsed).map(withDefaults).map(normalizeRecordImages);
          await compressLargeImages(list);
          records = list;
          save();
          renderCollection();
          filterRecords();
          alert("Tiedot ladattu onnistuneesti!");
        } catch (err) {
          alert("Virhe tiedoston lukemisessa!");
        }
      };
      reader.readAsText(file);
      event.target.value = "";
    }

    renderCollection();
  </script>
</body>
</html>
