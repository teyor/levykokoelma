<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Levykokoelma</title>
  <style>
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { font-family: Arial, sans-serif; margin: 0; padding: 16px; background: #111; color: #eee; }
    h1 { color: #ffcc00; font-size: 1.6rem; margin: 0 0 12px; }
    input, button, select, textarea { padding: 12px; margin: 5px 0; width: 100%; max-width: 100%; font-size: 16px; border-radius: 6px; border: 1px solid #444; background: #1a1a1a; color: #eee; }
    .field-group { margin: 8px 0; }
    .field-group > label { display: block; margin: 10px 0 2px; font-weight: bold; color: #eee; }
    .price-row { display: flex; align-items: center; gap: 8px; max-width: 400px; }
    .price-row input { flex: 1; width: auto; max-width: none; }
    .price-unit { font-weight: bold; color: #ffcc00; }
    .catalog-row { display: flex; flex-wrap: wrap; gap: 8px; max-width: 400px; }
    .catalog-row > div { flex: 1 1 140px; min-width: 0; }
    .catalog-row > div:last-child { flex: 0 1 150px; }
    .catalog-row label { display: block; margin: 10px 0 2px; font-weight: bold; color: #eee; }
    .catalog-row input { width: 100%; max-width: none; }
    button { background: #ffcc00; color: black; border: none; font-weight: bold; cursor: pointer; min-height: 44px; }
    .row-btns { display: flex; flex-wrap: wrap; gap: 8px; max-width: 100%; }
    .row-btns button { width: auto; flex: 1 1 140px; }
    .delete-btn { background: #ff4444; color: white; padding: 10px 12px; font-size: 15px; width: 100%; margin-top: 8px; }
    #preview { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; }
    .preview-item { position: relative; width: 110px; height: 110px; border: 2px solid #ffcc00; border-radius: 6px; overflow: hidden; background: #222; }
    .preview-item img { width: 100%; height: 100%; object-fit: cover; }
    .remove-image { position: absolute; top: 4px; right: 4px; background: #ff4444; color: white; border: none; padding: 2px 7px; font-size: 14px; cursor: pointer; border-radius: 3px; width: auto; min-height: 28px; }
    .thumbnail { width: 100%; height: 200px; object-fit: cover; border-radius: 4px; }
    .search { padding: 12px; width: 100%; max-width: 100%; font-size: 16px; }
    .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 16px; }
    .card { background: #1f1f1f; padding: 12px; border-radius: 8px; }
    .card img { width: 100%; border-radius: 4px; margin-bottom: 5px; }
    .note { color: #aaa; font-size: 14px; max-width: 100%; }
    @media (min-width: 640px) {
      body { padding: 20px; }
      input, button { max-width: 400px; }
      .search { max-width: 500px; }
      .list { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
      .preview-item { width: 130px; height: 130px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Levykokoelma</h1>
    <p class="note">Muutokset tallentuvat tämän selaimen muistiin. Ota välillä varmuuskopio napilla "Vie tiedot (JSON)".</p>

    <input type="text" id="search" class="search" placeholder="Hae artistia tai albumia..." onkeyup="filterRecords()">

    <h2 id="formHeading">Lisää uusi levy</h2>
    <label for="imageInput">Kansikuvat</label>
    <input type="file" id="imageInput" accept="image/*" multiple><br>
    <div id="preview"></div>

    <div class="field-group">
      <label for="artist">Artisti / Esittäjä</label>
      <input type="text" id="artist" placeholder="Pakollinen">
    </div>
    <div class="field-group">
      <label for="album">Albumin nimi</label>
      <input type="text" id="album" placeholder="Pakollinen">
    </div>
    <div class="field-group">
      <label for="purchaseDate">Hankintapäivä</label>
      <input type="date" id="purchaseDate">
    </div>
    <div class="field-group">
      <label for="price">Ostohinta</label>
      <div class="price-row">
        <input type="number" id="price" placeholder="0,00" step="0.01">
        <span class="price-unit">€</span>
      </div>
    </div>
    <div class="field-group">
      <div class="catalog-row">
        <div>
          <label for="catalogNumber">Kataloginumero</label>
          <input type="text" id="catalogNumber" placeholder="">
        </div>
        <div>
          <label for="country">Maa</label>
          <input type="text" id="country" placeholder="esim. Suomi">
        </div>
      </div>
    </div>
    <div class="field-group">
      <label for="condition">Kuntoluokitus</label>
      <select id="condition">
        <option value="">Valitse kunto</option>
        <option value="M">M — Mint</option>
        <option value="NM">NM — Near Mint</option>
        <option value="EX">EX — Excellent</option>
        <option value="VG+">VG+ — Very Good Plus</option>
        <option value="VG">VG — Very Good</option>
        <option value="G+">G+ — Good Plus</option>
        <option value="G">G — Good</option>
        <option value="F">F — Fair</option>
        <option value="P">P — Poor</option>
      </select>
    </div>
    <div class="field-group">
      <label for="marketPrice">Markkinahinta / arvio</label>
      <div class="price-row">
        <input type="text" id="marketPrice" placeholder="esim. 25–45">
        <span class="price-unit">€</span>
      </div>
    </div>
    <div class="field-group">
      <label for="notes">Lisätiedot</label>
      <textarea id="notes" rows="4" placeholder="Lisätiedot"></textarea>
    </div>

    <button type="button" id="deleteBtn" class="delete-btn" style="display:none; max-width:400px;" onclick="deleteCurrentRecord()">Poista</button>

    <div class="row-btns">
      <button onclick="addRecord()">Lisää / Tallenna muokkaus</button>
      <button onclick="exportData()">Vie tiedot (JSON)</button>
      <button onclick="document.getElementById('importInput').click()">Lataa tiedot</button>
    </div>
    <input type="file" id="importInput" accept=".json" style="display:none" onchange="importData(event)">

    <h2>Kokoelma (<span id="count">0</span> levyä)</h2>
    <div id="collection" class="list"></div>
  </div>

        (r.country || "").toLowerCase().includes(term) ||
        (r.condition || "").toLowerCase().includes(term) ||
        (r.notes || "").toLowerCase().includes(term)
      );
      renderCollection(filtered);
    }

    function exportData() {
      const dataStr = JSON.stringify(records, null, 2);
      const dataUri = "data:application/json;charset=utf-8," + encodeURIComponent(dataStr);
      const linkElement = document.createElement("a");
      linkElement.setAttribute("href", dataUri);
      linkElement.setAttribute("download", "levykokoelma-backup.json");
      linkElement.click();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async function (e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!Array.isArray(parsed)) throw new Error("not an array");
          // Old backups contain base64 images: built-in ones map back to images/*.jpg,
          // other large photos are shrunk so they fit in localStorage.
          const list = dedupeKeepFirst(parsed).map(withDefaults).map(normalizeRecordImages);
          await compressLargeImages(list);
          records = list;
          save();
          renderCollection();
          filterRecords();
          alert("Tiedot ladattu onnistuneesti!");
        } catch (err) {
          alert("Virhe tiedoston lukemisessa!");
        }
      };
      reader.readAsText(file);
      event.target.value = "";
    }

    renderCollection();
  </script>
</body>
</html>
